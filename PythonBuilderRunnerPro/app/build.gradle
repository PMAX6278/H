plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.pbrpro'
    compileSdk 35

    defaultConfig {
        applicationId 'com.pbrpro'
        minSdk 24
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        ndk { abiFilters 'arm64-v8a', 'armeabi-v7a' }
    }
}

chaquopy {
    defaultConfig {
        version = '3.11'
        pip {
            install 'requests'
            install 'colorama'
            install 'six'
        }
    }
}
