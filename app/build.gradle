plugins {
    id 'com.android.application'
    id 'com.chaquo.python'
}

android {
    namespace 'com.ultimate.mikrotik'
    compileSdk 35
    defaultConfig {
        applicationId 'com.ultimate.mikrotik'
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName '1.0.0'
        python {
            version '3.11'
            pip {
                install 'flask==3.1.1'
                install 'routeros-api==0.17.0'
            }
        }
    }
}

dependencies {
    implementation 'androidx.security:security-crypto:1.1.0-alpha06'
}
